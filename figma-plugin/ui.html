<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: #555; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 0; background: #0d99ff; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  button.alt { background: #fff; color: #0d99ff; border: 1px solid #0d99ff; margin-left: 6px; }
  #status { margin-top: 12px; white-space: pre-wrap; max-height: 130px; overflow: auto; font-size: 12px; }
  .err { color: #c0392b; }
</style>
</head>
<body>
  <h1>Figma → Affinity <span style="font-weight:400;color:#888">0.2.0-beta</span></h1>
  <p>Chọn một hoặc nhiều frame rồi bấm Xuất. File <b>.figaf</b> sẽ được tải về; chép file đó ra <b>Desktop</b> rồi mở bằng script trong Affinity.</p>
  <button id="go">Xuất frame đang chọn</button><button id="goIdml" class="alt" title="Thử nghiệm: file .idml mở thẳng bằng File → Open trong Affinity, không cần script">Xuất IDML (thử)</button>
  <div id="status"></div>
<script>
// BEGIN idml-writer
// Dựng file IDML (định dạng trao đổi của InDesign) từ dữ liệu plugin xuất ra.
// Affinity mở trực tiếp file .idml bằng File → Open, không cần script.
// Dùng chung trong ui.html (trình duyệt) và tools/ (Node) nên không phụ thuộc thư viện nào.
// 1 px Figma = 1 pt trong IDML, nên số đo giữ nguyên.

var IDML = (function () {
  'use strict';

  // ---------- tiện ích ----------

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      // ký tự điều khiển không hợp lệ trong XML
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
  }
  function n(v) {
    if (!isFinite(v)) return '0';
    var r = Math.round(v * 1000) / 1000;
    return String(r === 0 ? 0 : r);
  }
  function mat(m) { // Figma [[a,c,tx],[b,d,ty]] -> IDML "a b c d tx ty"
    return n(m[0][0]) + ' ' + n(m[1][0]) + ' ' + n(m[0][1]) + ' ' + n(m[1][1]) + ' ' + n(m[0][2]) + ' ' + n(m[1][2]);
  }
  function mul(A, B) {
    return [
      [A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1], A[0][0] * B[0][2] + A[0][1] * B[1][2] + A[0][2]],
      [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1], A[1][0] * B[0][2] + A[1][1] * B[1][2] + A[1][2]]
    ];
  }
  function inv(t) {
    var a = t[0][0], b = t[0][1], c = t[0][2], d = t[1][0], e = t[1][1], f = t[1][2];
    var det = a * e - b * d;
    if (Math.abs(det) < 1e-12) return [[1, 0, 0], [0, 1, 0]];
    return [[e / det, -b / det, (b * f - c * e) / det], [-d / det, a / det, (c * d - a * f) / det]];
  }
  function ap(m, x, y) { return [m[0][0] * x + m[0][1] * y + m[0][2], m[1][0] * x + m[1][1] * y + m[1][2]]; }
  var I = [[1, 0, 0], [0, 1, 0]];

  // ---------- zip (không nén, đủ cho IDML) ----------

  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var i = 0; i < 256; i++) {
      var c = i;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[i] = c >>> 0;
    }
    return t;
  })();
  function crc32(b) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function utf8(s) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(s);
    return new Uint8Array(Buffer.from(s, 'utf8'));
  }
  function zip(files) { // [{name, data: Uint8Array|string}]
    var parts = [], central = [], off = 0;
    files.forEach(function (f) {
      var name = utf8(f.name);
      var data = typeof f.data === 'string' ? utf8(f.data) : f.data;
      var crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    });
    var csize = central.reduce(function (s, p) { return s + p.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, csize, true); e.setUint32(16, off, true);
    var all = parts.concat(central, [new Uint8Array(e.buffer)]);
    var total = all.reduce(function (s, p) { return s + p.length; }, 0);
    var out = new Uint8Array(total), p = 0;
    all.forEach(function (a) { out.set(a, p); p += a.length; });
    return out;
  }

  function b64(bytes) {
    if (typeof btoa === 'undefined') return Buffer.from(bytes).toString('base64');
    var s = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  }

  // Kích thước ảnh PNG/JPEG từ header.
  function imageInfo(b) {
    if (!b || b.length < 24) return null;
    if (b[0] === 0x89 && b[1] === 0x50) {
      return { w: (b[16] << 24 | b[17] << 16 | b[18] << 8 | b[19]) >>> 0, h: (b[20] << 24 | b[21] << 16 | b[22] << 8 | b[23]) >>> 0, ext: 'png', type: '$ID/Portable Network Graphics (PNG)' };
    }
    if (b[0] === 0xFF && b[1] === 0xD8) {
      var i = 2;
      while (i + 9 < b.length) {
        if (b[i] !== 0xFF) { i++; continue; }
        var mk = b[i + 1], len = b[i + 2] << 8 | b[i + 3];
        if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC) {
          return { h: b[i + 5] << 8 | b[i + 6], w: b[i + 7] << 8 | b[i + 8], ext: 'jpg', type: '$ID/JPEG' };
        }
        i += 2 + len;
      }
    }
    if (b[0] === 0x47 && b[1] === 0x49) return { w: b[6] | b[7] << 8, h: b[8] | b[9] << 8, ext: 'gif', type: '$ID/GIF' };
    return null;
  }

  // ---------- trình dựng ----------

  function build(doc, imageBytes, opts) {
    opts = opts || {};
    var warnings = [];
    var idc = 0;
    function uid(p) { return (p || 'u') + (++idc).toString(16); }
    function warn(node, msg) { warnings.push((node && node.name ? '"' + node.name + '": ' : '') + msg); }

    // --- màu ---
    var colors = {}, colorXml = [];
    function color(c) {
      var r = Math.max(0, Math.min(255, Math.round(c.r))), g = Math.max(0, Math.min(255, Math.round(c.g))), b = Math.max(0, Math.min(255, Math.round(c.b)));
      var key = r + '_' + g + '_' + b;
      if (!colors[key]) {
        colors[key] = 'Color/R=' + r + ' G=' + g + ' B=' + b;
        colorXml.push('<Color Self="' + esc(colors[key]) + '" Model="Process" Space="RGB" ColorValue="' + r + ' ' + g + ' ' + b + '" ColorOverride="Normal" AlternateSpace="NoAlternateColor" AlternateColorValue="" Name="R=' + r + ' G=' + g + ' B=' + b + '" ColorEditable="true" ColorRemovable="true" Visible="true" SwatchCreatorID="7937"/>');
      }
      return colors[key];
    }
    var gradXml = [];
    function gradient(p, node) {
      var id = 'Gradient/' + uid('g');
      var type = p.type === 'LINEAR' ? 'Linear' : 'Radial';
      if (p.type === 'ANGULAR') warn(node, 'gradient góc (angular) trong IDML được chuyển thành gradient tròn.');
      var stops = p.stops.slice().sort(function (a, b) { return a.pos - b.pos; });
      if (stops.some(function (s) { return s.a < 0.999; })) warn(node, 'IDML không có độ trong suốt riêng từng điểm màu của gradient, đã bỏ phần trong suốt.');
      var xml = '<Gradient Self="' + id + '" Type="' + type + '" Name="' + id.slice(9) + '" ColorEditable="true" ColorRemovable="true" Visible="true" SwatchCreatorID="7937">';
      stops.forEach(function (s) {
        xml += '<GradientStop Self="' + id + 's' + uid('') + '" StopColor="' + esc(color(s)) + '" Location="' + n(s.pos * 100) + '" Midpoint="50"/>';
      });
      gradXml.push(xml + '</Gradient>');
      return id;
    }

    // --- story ---
    var stories = [];

    // --- thuộc tính fill/stroke cho một page item ---
    // local: ma trận toạ độ trong item -> toạ độ page (để tính điểm đầu gradient trong toạ độ item)
    function fillAttrs(node, paint, local) {
      if (!paint) return { attrs: ' FillColor="Swatch/None"', fillAlpha: 1 };
      if (paint.type === 'SOLID') return { attrs: ' FillColor="' + esc(color(paint)) + '"', fillAlpha: paint.a };
      if (paint.stops) {
        var g = gradient(paint, node);
        var li = inv(local);
        var s, e;
        if (paint.gx) {
          if (paint.type === 'LINEAR') { s = ap(paint.gx, 0, 0.5); e = ap(paint.gx, 1, 0.5); }
          else { s = ap(paint.gx, 0.5, 0.5); e = ap(paint.gx, 1, 0.5); }
        } else { s = paint.start; e = paint.end; }
        var ls = ap(li, s[0], s[1]), le = ap(li, e[0], e[1]);
        var dx = le[0] - ls[0], dy = le[1] - ls[1];
        var len = Math.sqrt(dx * dx + dy * dy);
        var ang = -Math.atan2(dy, dx) * 180 / Math.PI;
        return {
          attrs: ' FillColor="' + g + '" GradientFillStart="' + n(ls[0]) + ' ' + n(ls[1]) + '" GradientFillLength="' + n(len) + '" GradientFillAngle="' + n(ang) + '"',
          fillAlpha: paint.opacity === undefined ? 1 : paint.opacity
        };
      }
      return { attrs: ' FillColor="Swatch/None"', fillAlpha: 1 };
    }

    function strokeAttrs(node) {
      if (!node.strokes || !node.strokes.length || !node.strokeWeight) return { attrs: ' StrokeColor="Swatch/None" StrokeWeight="0"', alpha: 1 };
      var s = node.strokes[0];
      if (node.strokes.length > 1) warn(node, 'nhiều lớp viền, chỉ giữ lớp trên cùng.');
      var col = s.type === 'SOLID' ? color(s) : (s.stops ? color(s.stops[0]) : 'Color/Black');
      var alpha = s.type === 'SOLID' ? s.a : 1;
      var align = { INSIDE: 'InsideAlignment', OUTSIDE: 'OutsideAlignment' }[node.strokeAlign] || 'CenterAlignment';
      var cap = { ROUND: 'RoundEndCap', SQUARE: 'ProjectingEndCap' }[node.strokeCap] || 'ButtEndCap';
      var join = { ROUND: 'RoundEndJoin', BEVEL: 'BevelEndJoin' }[node.strokeJoin] || 'MiterEndJoin';
      var a = ' StrokeColor="' + esc(col) + '" StrokeWeight="' + n(node.strokeWeight) + '" StrokeAlignment="' + align + '" EndCap="' + cap + '" EndJoin="' + join + '"';
      if (node.dashPattern && node.dashPattern.length) {
        a += ' StrokeType="StrokeStyle/$ID/Dashed"';
      }
      return { attrs: a, alpha: alpha };
    }

    // Hiệu ứng + độ trong suốt: các phần tử con của page item.
    function transparencyXml(node, fillAlpha, strokeAlpha, withEffects) {
      var x = '';
      var op = node.opacity === undefined ? 1 : node.opacity;
      var drop = null, inner = null;
      if (withEffects) {
        (node.effects || []).forEach(function (e) {
          if (e.type === 'DROP_SHADOW') { if (!drop) drop = e; else warn(node, 'IDML chỉ có một bóng đổ mỗi layer, bỏ các bóng còn lại.'); }
          else if (e.type === 'INNER_SHADOW') { if (!inner) inner = e; else warn(node, 'chỉ giữ một inner shadow.'); }
          else if (e.type === 'LAYER_BLUR') warn(node, 'layer blur không có trong IDML, đã bỏ qua.');
        });
      }
      function shadowXml(tag, e) {
        var dist = Math.sqrt(e.offset.x * e.offset.x + e.offset.y * e.offset.y);
        var ang = dist ? -Math.atan2(e.offset.y, e.offset.x) * 180 / Math.PI : 90;
        var common = ' BlendMode="Multiply" Opacity="' + n(e.color.a * 100) + '" Size="' + n(e.radius) + '" Distance="' + n(dist) + '" Angle="' + n(ang) +
          '" EffectColor="' + esc(color(e.color)) + '" UseGlobalLight="false"';
        if (tag === 'DropShadowSetting') {
          return '<DropShadowSetting Mode="Drop"' + common + ' XOffset="' + n(e.offset.x) + '" YOffset="' + n(e.offset.y) + '" Spread="' + n(e.radius ? Math.min(100, (e.spread || 0) / e.radius * 100) : 0) + '"/>';
        }
        return '<InnerShadowSetting Applied="true"' + common + ' ChokeAmount="' + n(e.radius ? Math.min(100, (e.spread || 0) / e.radius * 100) : 0) + '"/>';
      }
      if (op < 0.999 || drop || inner) {
        x += '<TransparencySetting>';
        if (op < 0.999) x += '<BlendingSetting Opacity="' + n(op * 100) + '"/>';
        if (drop) x += shadowXml('DropShadowSetting', drop);
        if (inner) x += shadowXml('InnerShadowSetting', inner);
        x += '</TransparencySetting>';
      }
      if (fillAlpha < 0.999) x += '<FillTransparencySetting><BlendingSetting Opacity="' + n(fillAlpha * 100) + '"/></FillTransparencySetting>';
      if (strokeAlpha < 0.999) x += '<StrokeTransparencySetting><BlendingSetting Opacity="' + n(strokeAlpha * 100) + '"/></StrokeTransparencySetting>';
      return x;
    }

    // --- hình học ---
    function pathPointsXml(subpaths) { // subpaths: [{open, pts:[{a,l,r}]}]
      var x = '<Properties><PathGeometry>';
      subpaths.forEach(function (sp) {
        x += '<GeometryPathType PathOpen="' + (sp.open ? 'true' : 'false') + '"><PathPointArray>';
        sp.pts.forEach(function (p) {
          x += '<PathPointType Anchor="' + n(p.a[0]) + ' ' + n(p.a[1]) + '" LeftDirection="' + n(p.l[0]) + ' ' + n(p.l[1]) + '" RightDirection="' + n(p.r[0]) + ' ' + n(p.r[1]) + '"/>';
        });
        x += '</PathPointArray></GeometryPathType>';
      });
      return x + '</PathGeometry></Properties>';
    }
    function rectPts(w, h) {
      var c = [[0, 0], [0, h], [w, h], [w, 0]];
      return [{ open: false, pts: c.map(function (p) { return { a: p, l: p, r: p }; }) }];
    }
    function ovalPts(w, h) {
      var k = 0.5522847498, cx = w / 2, cy = h / 2, rx = w / 2, ry = h / 2;
      return [{
        open: false, pts: [
          { a: [0, cy], l: [0, cy + ry * k], r: [0, cy - ry * k] },
          { a: [cx, 0], l: [cx - rx * k, 0], r: [cx + rx * k, 0] },
          { a: [w, cy], l: [w, cy - ry * k], r: [w, cy + ry * k] },
          { a: [cx, h], l: [cx + rx * k, h], r: [cx - rx * k, h] }
        ]
      }];
    }
    // cmds (toạ độ page) -> subpaths trong toạ độ item (qua ma trận li)
    function cmdsToSub(paths, li) {
      var subs = [];
      (paths || []).forEach(function (p) {
        var cur = null;
        function flush(closed) {
          if (!cur || !cur.pts.length) return;
          var pts = cur.pts;
          if (closed && pts.length > 1) {
            var f = pts[0], l = pts[pts.length - 1];
            if (Math.abs(f.a[0] - l.a[0]) < 1e-3 && Math.abs(f.a[1] - l.a[1]) < 1e-3) {
              f.l = l.l; pts.pop();
            }
          }
          cur.open = !closed;
          if (pts.length) subs.push(cur);
          cur = null;
        }
        (p.cmds || []).forEach(function (c) {
          if (c[0] === 'M') {
            flush(false);
            var a = ap(li, c[1], c[2]);
            cur = { pts: [{ a: a, l: a, r: a }] };
          } else if (c[0] === 'L' && cur) {
            var b = ap(li, c[1], c[2]);
            cur.pts.push({ a: b, l: b, r: b });
          } else if (c[0] === 'C' && cur) {
            var c1 = ap(li, c[1], c[2]), c2 = ap(li, c[3], c[4]), e = ap(li, c[5], c[6]);
            cur.pts[cur.pts.length - 1].r = c1;
            cur.pts.push({ a: e, l: c2, r: e });
          } else if (c[0] === 'Z') {
            var start = cur && cur.pts[0];
            flush(true);
            if (start) cur = null;
          }
        });
        flush(!!(p.open === false));
        if (p.open === true && subs.length) subs[subs.length - 1].open = true;
      });
      return subs;
    }
    function cornerAttrs(r) {
      if (!r) return '';
      var x = '';
      [['TopLeft', r.tl], ['TopRight', r.tr], ['BottomLeft', r.bl], ['BottomRight', r.br]].forEach(function (c) {
        if (c[1] > 0) x += ' ' + c[0] + 'CornerOption="RoundedCorner" ' + c[0] + 'CornerRadius="' + n(c[1]) + '"';
      });
      return x;
    }

    // --- ảnh ---
    var imgCache = [];
    function imageXml(node, paint, w, h) {
      var bytes = imageBytes[paint.image];
      var info = imageInfo(bytes);
      if (!info) { warn(node, 'không đọc được ảnh, đã bỏ qua.'); return ''; }
      var iw = info.w, ih = info.h, M;
      if (paint.scaleMode === 'CROP' && paint.imageTransform) {
        M = mul([[w, 0, 0], [0, h, 0]], mul(inv(paint.imageTransform), [[1 / iw, 0, 0], [0, 1 / ih, 0]]));
      } else {
        var s = paint.scaleMode === 'FIT' ? Math.min(w / iw, h / ih) : Math.max(w / iw, h / ih);
        M = [[s, 0, (w - iw * s) / 2], [0, s, (h - ih * s) / 2]];
      }
      if (paint.rotation) warn(node, 'ảnh bị xoay trong khung chưa được chuyển góc xoay.');
      var file = 'image' + (paint.image + 1) + '.' + info.ext;
      if (!imgCache[paint.image]) imgCache[paint.image] = { name: file, bytes: bytes };
      var self = uid('img');
      var uri = (opts.linkBase || 'file:Links/') + file;
      var x = '<Image Self="' + self + '" Space="$ID/#Links_RGB" ActualPpi="72 72" EffectivePpi="' + n(72 / M[0][0]) + ' ' + n(72 / M[1][1]) + '" ImageTypeName="' + info.type + '" AppliedObjectStyle="ObjectStyle/$ID/[None]" ItemTransform="' + mat(M) + '"' + (paint.opacity < 0.999 ? '' : '') + '>';
      x += '<Properties><Profile type="string">$ID/None</Profile><GraphicBounds Left="0" Top="0" Right="' + iw + '" Bottom="' + ih + '"/>';
      if (opts.embedImages !== false) x += '<Contents><![CDATA[' + b64(bytes) + ']]></Contents>';
      x += '</Properties>';
      if (paint.opacity < 0.999) x += '<TransparencySetting><BlendingSetting Opacity="' + n(paint.opacity * 100) + '"/></TransparencySetting>';
      x += '<Link Self="' + uid('lnk') + '" AssetURL="$ID/" AssetID="$ID/" LinkResourceURI="' + esc(uri) + '" LinkResourceFormat="' + info.type + '" StoredState="' + (opts.embedImages !== false ? 'Embedded' : 'Normal') + '" LinkClassID="35906" LinkClientID="257" LinkResourceModified="false" LinkObjectModified="false" ShowInUI="true" CanEmbed="true" CanUnembed="true" CanPackage="true" ImportPolicy="NoAutoImport" ExportPolicy="NoAutoExport" LinkImportStamp="" LinkImportModificationTime="" LinkImportTime="" LinkResourceSize="0~0"/>';
      return x + '</Image>';
    }

    // --- page item cho một hình (rect/ellipse/path/frame nền) ---
    // abs: ma trận item -> page; parentAbs: ma trận của phần tử cha -> page
    // geo: {kind:'rect'|'oval'|'path', w,h, radius, paths}
    // inside: chuỗi XML phần tử con (nội dung bị cắt), nếu có
    function shapeXml(node, geo, paint, parentAbs, abs, withStroke, withEffects, inside, name) {
      var tag = geo.kind === 'oval' ? 'Oval' : (geo.kind === 'path' ? 'Polygon' : 'Rectangle');
      var self = uid('it');
      var f = paint && paint.type === 'IMAGE' ? { attrs: ' FillColor="Swatch/None"', fillAlpha: 1 } : fillAttrs(node, paint, abs);
      var st = withStroke ? strokeAttrs(node) : { attrs: ' StrokeColor="Swatch/None" StrokeWeight="0"', alpha: 1 };
      var sub = geo.kind === 'oval' ? ovalPts(geo.w, geo.h) : geo.kind === 'path' ? cmdsToSub(geo.paths, inv(abs)) : rectPts(geo.w, geo.h);
      if (!sub.length) return '';
      var local = mul(inv(parentAbs), abs);

  btn.disabled = btnIdml.disabled = true;
  setStatus('Đang đọc dữ liệu Figma…');
  parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
}
btn.onclick = function () { startExport('figaf'); };
btnIdml.onclick = function () { startExport('idml'); };

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// Bản thử: dựng file .idml ngay trong plugin, Affinity mở bằng File → Open.
// IDML chỉ nhúng được PNG/JPEG/GIF: ảnh định dạng khác (WebP…) được chuyển sang PNG.
async function toPng(bytes) {
  const bmp = await createImageBitmap(new Blob([bytes]));
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  const blob = await new Promise(function (r) { c.toBlob(r, 'image/png'); });
  return new Uint8Array(await blob.arrayBuffer());
}

async function exportIdml(msg) {
  const images = [];
  for (const b of msg.images) {
    if (b && !IDML.imageInfo(b)) {
      try { images.push(await toPng(b)); } catch (e) { images.push(b); }
    } else images.push(b);
  }
  const res = IDML.build(msg.doc, images, {});
  const name = msg.fileName.replace(/\.figaf$/, '') + '.idml';
  download(new Blob([res.idml], { type: 'application/vnd.adobe.indesign-idml-package' }), name);
  const s = msg.doc.stats;
  const warns = msg.doc.warnings.concat(res.warnings);
  let summary = 'Đã xuất ' + name + ' (' + (res.idml.length / 1048576).toFixed(1) + ' MB).\n' +
    'Frame: ' + (s.frame || 0) + ', text: ' + (s.text || 0) + ', hình: ' + ((s.rect || 0) + (s.ellipse || 0) + (s.path || 0)) +
    ', ảnh: ' + msg.images.filter(Boolean).length + '.\nMở bằng File → Open trong Affinity.';
  if (warns.length) summary += '\n\nCảnh báo (' + warns.length + '):\n- ' + warns.slice(0, 30).join('\n- ');
  setStatus(summary);
  parent.postMessage({ pluginMessage: { type: 'done', fileName: name } }, '*');
}

// Giải mã PNG/JPEG thành điểm ảnh RGBA thô (Affinity script không tự giải mã được PNG).
async function decodeImage(bytes) {
  const blob = new Blob([bytes]);
  let w, h, draw;
  if (window.createImageBitmap) {
    const bmp = await createImageBitmap(blob);
    w = bmp.width; h = bmp.height; draw = bmp;
  } else {
    const url = URL.createObjectURL(blob);
    const img = await new Promise(function (resolve, reject) {
      const im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = reject;
      im.src = url;
    });
    w = img.naturalWidth; h = img.naturalHeight; draw = img;
  }
  const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(w, h));
  const tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = tw; canvas.height = th;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(draw, 0, 0, tw, th);
  const data = ctx.getImageData(0, 0, tw, th).data;
  return { w: tw, h: th, origW: w, origH: h, pixels: new Uint8Array(data.buffer) };
}

async function buildFile(doc, images) {
  const blobs = [];
  let offset = 0;
  for (let i = 0; i < images.length; i++) {
    setStatus('Đang xử lý ảnh ' + (i + 1) + '/' + images.length + '…');
    if (!images[i]) { doc.images.push(null); continue; }
    try {
      const dec = await decodeImage(images[i]);
      doc.images.push({ w: dec.w, h: dec.h, origW: dec.origW, origH: dec.origH, offset: offset, length: dec.pixels.length });
      blobs.push(dec.pixels);
      offset += dec.pixels.length;
    } catch (e) {
      doc.images.push(null);
      doc.warnings.push('Không giải mã được ảnh số ' + i + '.');
    }
  }
  const json = new TextEncoder().encode(JSON.stringify(doc));
  const header = new Uint8Array(10);
  header.set([70, 73, 71, 65, 70, 49]); // "FIGAF1"
  new DataView(header.buffer).setUint32(6, json.length, true);
  return new Blob([header, json].concat(blobs), { type: 'application/octet-stream' });
}

window.onmessage = async function (event) {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'progress') {
    setStatus(msg.message);
  } else if (msg.type === 'error') {
    setStatus(msg.message, true);
    btn.disabled = btnIdml.disabled = false;
  } else if (msg.type === 'payload') {
    if (mode === 'idml') {
      try { await exportIdml(msg); } catch (e) { setStatus('Lỗi khi tạo file IDML: ' + (e && e.message ? e.message : e), true); }
      btn.disabled = btnIdml.disabled = false;
      return;
    }
    try {
      const blob = await buildFile(msg.doc, msg.images);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = msg.fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      const s = msg.doc.stats;
      let summary = 'Đã xuất ' + msg.fileName + ' (' + (blob.size / 1048576).toFixed(1) + ' MB).\n' +
        'Frame: ' + (s.frame || 0) + ', text: ' + (s.text || 0) + ', hình: ' + ((s.rect || 0) + (s.ellipse || 0) + (s.path || 0)) +
        ', ảnh: ' + msg.doc.images.filter(Boolean).length + '.';
      if (msg.doc.warnings.length) summary += '\n\nCảnh báo (' + msg.doc.warnings.length + '):\n- ' + msg.doc.warnings.slice(0, 30).join('\n- ');
      setStatus(summary);
      parent.postMessage({ pluginMessage: { type: 'done', fileName: msg.fileName } }, '*');
    } catch (e) {
      setStatus('Lỗi khi tạo file: ' + (e && e.message ? e.message : e), true);
    }
    btn.disabled = btnIdml.disabled = false;
  }
};
</script>
